<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Role</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

    <div class="max-w-6xl mx-auto bg-white shadow rounded-lg p-8">

        <!-- PAGE TITLE -->
        <h1 class="text-2xl font-semibold text-gray-800 mb-6">Add Role</h1>

        <!-- FORM START -->
        <form class="space-y-10">

            <!-- =============== SECTION BLOCK COMPONENT =============== -->
            <!-- Use this structure repeatedly for all modules -->

            <!-- Dashboard -->
            <div>
                <h2 class="text-lg font-medium text-gray-700 mb-3">Dashboard</h2>
                <div class="border rounded-lg p-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <!-- Left Side -->
                        <div>
                            <p class="font-medium text-gray-600 mb-2">View</p>
                            <label class="flex items-center gap-2 mb-2">
                                <input type="checkbox" class="w-4 h-4"> <span>Allow View</span>
                            </label>
                        </div>

                        <!-- Right Side -->
                        <div>
                            <p class="font-medium text-gray-600 mb-2">Actions</p>

                            <label class="flex items-center gap-2 mb-1">
                                <input type="checkbox" class="w-4 h-4"> Add
                            </label>
                            <label class="flex items-center gap-2 mb-1">
                                <input type="checkbox" class="w-4 h-4"> Edit
                            </label>
                            <label class="flex items-center gap-2 mb-1">
                                <input type="checkbox" class="w-4 h-4"> Delete
                            </label>
                        </div>

                    </div>
                </div>
            </div>

            <!-- =============== MODULE TEMPLATE (COPY BELOW) =============== -->
            <!-- Just repeat this block for all modules as in screenshot -->

            <div>
                <h2 class="text-lg font-medium text-gray-700 mb-3">Users</h2>
                <div class="border rounded-lg p-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div>
                            <p class="font-medium text-gray-600 mb-2">View</p>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" class="w-4 h-4"> Allow View
                            </label>
                        </div>

                        <div>
                            <p class="font-medium text-gray-600 mb-2">Actions</p>

                            <label class="flex items-center gap-2 mb-1">
                                <input type="checkbox" class="w-4 h-4"> Add
                            </label>
                            <label class="flex items-center gap-2 mb-1">
                                <input type="checkbox" class="w-4 h-4"> Edit
                            </label>
                            <label class="flex items-center gap-2 mb-1">
                                <input type="checkbox" class="w-4 h-4"> Delete
                            </label>

                        </div>

                    </div>
                </div>
            </div>

            <!-- Repeat same section block for: 
                 - Roles
                 - Products
                 - Inventory
                 - Orders
                 - POS
                 - Expenses
                 - Reports
                 - Accounting
                 - Settings
                 - Payments
                 - Offers
                 - Customers
                 - Ledger
                 - Category
                 - Supplier
                 - Backup
            -->
            
            <!-- Example More Sections Summarized to Save Space -->
            <div>
                <h2 class="text-lg font-medium text-gray-700 mb-3">Products</h2>
                <div class="border rounded-lg p-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <div>
                            <p class="font-medium">View</p>
                            <label class="flex items-center gap-2">
                                <input type="checkbox" class="w-4 h-4"> View Products
                            </label>
                        </div>

                        <div>
                            <p class="font-medium">Actions</p>
                            <label class="flex items-center gap-2"><input type="checkbox" class="w-4 h-4"> Add</label>
                            <label class="flex items-center gap-2"><input type="checkbox" class="w-4 h-4"> Edit</label>
                            <label class="flex items-center gap-2"><input type="checkbox" class="w-4 h-4"> Delete</label>
                        </div>

                    </div>
                </div>
            </div>

            <!-- END OF MODULE SECTIONS -->


            <!-- SAVE BUTTON -->
            <div class="pt-8">
                <button class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700">
                    Save
                </button>
            </div>

        </form>

    </div>

</body>
</html>
