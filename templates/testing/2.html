<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laxminarayan Pearls - Dashboard</title>
    <meta name="description" content="Farmhouse management dashboard for sales, inventory, and business operations" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#1a4f9c',
                            light: '#e8f0fe',
                            dark: '#0d3a7a',
                        },
                        stat: {
                            blue: '#1a4f9c',
                            'blue-light': '#e8f0fe',
                            yellow: '#f59e0b',
                            'yellow-light': '#fef3c7',
                            green: '#22c55e',
                            'green-light': '#dcfce7',
                            orange: '#f97316',
                            'orange-light': '#ffedd5',
                            purple: '#8b5cf6',
                            'purple-light': '#f3e8ff',
                            red: '#ef4444',
                            'red-light': '#fee2e2',
                        },
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background: rgba(255, 255, 255, 0.15);
        }


        /* shrink specifics */
        .sidebar-shrink .nav-label {
            display: none;
        }

        .sidebar-shrink .submenu {
            display: none;
        }

        /* hide nested submenus in shrink mode */
        .sidebar-shrink .logo-text {
            display: none;
        }

        .sidebar-shrink .w-60 {
            width: 4.5rem !important;
        }

        /* Tailwind override to roughly w-18 */
        /* collapsed: hide sidebar completely */
        .sidebar-collapsed {
            transform: translateX(-120%);
        }

        /* arrow rotation */
        .arrow-rotated {
            transform: rotate(90deg);
        }

        /* mobile offcanvas overlay */
        .offcanvas-backdrop {
            background: rgba(0, 0, 0, 0.4);
        }

        .transition-fast {
            transition: all 220ms cubic-bezier(.2, .8, .2, 1);
        }
    </style>
</head>

    <script>
        (function () {
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main');
            const toggleShrink = document.getElementById('toggleShrink');
            const toggleCollapse = document.getElementById('toggleCollapse');
            const mobileMenuBtn = document.getElementById('mobileMenuBtn');
            const mobileSidebar = document.getElementById('mobileSidebar');
            const mobileBackdrop = document.getElementById('mobileSidebarBackdrop');
            const mobileClose = document.getElementById('mobileClose');

            // Mode state: 'expanded' | 'shrink' | 'collapsed'
            let mode = localStorage.getItem('sidebarMode') || 'expanded';

            function applyMode() {
                // cleanup classes
                document.body.classList.remove('sidebar-shrink', 'sidebar-collapsed');
                sidebar.classList.remove('sidebar-shrink', 'sidebar-collapsed');
                main.classList.remove('ml-20', 'ml-0', 'ml-60');

                if (mode === 'expanded') {
                    // default wide sidebar
                    sidebar.style.transform = '';
                    sidebar.classList.remove('sidebar-shrink', 'sidebar-collapsed');
                    main.style.marginLeft = '15rem'; // ml-60 equivalent
                    main.classList.add('transition-fast');
                    toggleShrink.setAttribute('aria-pressed', 'false');
                    toggleCollapse.setAttribute('aria-pressed', 'false');
                } else if (mode === 'shrink') {
                    // icons only
                    sidebar.classList.add('sidebar-shrink');
                    sidebar.style.transform = '';
                    main.style.marginLeft = '4.5rem'; // small margin when shrink
                    toggleShrink.setAttribute('aria-pressed', 'true');
                    toggleCollapse.setAttribute('aria-pressed', 'false');
                } else if (mode === 'collapsed') {
                    sidebar.classList.add('sidebar-collapsed');
                    // put main margin to 0 so full width content visible
                    main.style.marginLeft = '0';
                    toggleShrink.setAttribute('aria-pressed', 'false');
                    toggleCollapse.setAttribute('aria-pressed', 'true');
                }

                // save mode
                localStorage.setItem('sidebarMode', mode);
            }

            // initial apply
            applyMode();

            // Shrink toggle handler (toggle between expanded <-> shrink)
            toggleShrink.addEventListener('click', () => {
                if (mode === 'expanded') mode = 'shrink';
                else mode = 'expanded';
                applyMode();
                updateOpenCollapsedVisibility();
            });

            // Collapse toggle handler (full collapse)
            toggleCollapse.addEventListener('click', () => {
                if (mode === 'collapsed') {
                    // uncollapse -> go to expanded
                    mode = 'expanded';
                } else {
                    mode = 'collapsed';
                }
                applyMode();
                updateOpenCollapsedVisibility();
            });

            // Submenu toggles (both desktop and mobile)
            document.querySelectorAll('[data-toggle="submenu"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const targetId = btn.getAttribute('data-target');
                    if (!targetId) return;
                    const sub = document.getElementById(targetId);
                    if (!sub) return;
                    const arrow = btn.querySelector('.arrow');

                    // If parent sidebar is in shrink mode, expand to show submenu briefly (UX choice) - here we simply ignore submenu toggles in shrink
                    if (sidebar.classList.contains('sidebar-shrink') && btn.closest('#sidebar')) {
                        // do nothing (keeps it simple)
                    } else {
                        sub.classList.toggle('hidden');
                        if (arrow) arrow.classList.toggle('arrow-rotated');
                    }
                });
            });

            // Mobile off-canvas open
            mobileMenuBtn.addEventListener('click', () => {
                mobileSidebar.classList.remove('-translate-x-full');
                mobileBackdrop.classList.remove('hidden');
                mobileBackdrop.classList.add('block');
                setTimeout(() => {
                    mobileSidebar.style.transform = 'translateX(0)';
                }, 10);
                mobileMenuBtn.setAttribute('aria-expanded', 'true');
            });

            // Mobile close
            window.closeMobile = function closeMobile() {
                mobileSidebar.style.transform = '';
                mobileSidebar.classList.add('-translate-x-full');
                mobileBackdrop.classList.add('hidden');
                mobileBackdrop.classList.remove('block');
                mobileMenuBtn.setAttribute('aria-expanded', 'false');
            }
            mobileClose.addEventListener('click', closeMobile);
            mobileBackdrop.addEventListener('click', closeMobile);

            // Close mobile on escape
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (!mobileBackdrop.classList.contains('hidden')) closeMobile();
                }
            });

            // When window resizes to small, ensure approach consistent (no major changes needed)
            window.addEventListener('resize', () => {
                // nothing special, but we could auto-switch mode on tiny screens if wanted
            });

            // Accessibility: if sidebar collapsed, show "openCollapsed" button in header
            const openCollapsed = document.getElementById('openCollapsed');
            function updateOpenCollapsedVisibility() {
                if (mode === 'collapsed') {
                    openCollapsed.classList.remove('hidden');
                    openCollapsed.setAttribute('aria-hidden', 'false');
                    openCollapsed.addEventListener('click', () => {
                        mode = 'expanded';
                        applyMode();
                        updateOpenCollapsedVisibility();
                    }, { once: true });
                } else {
                    openCollapsed.classList.add('hidden');
                    openCollapsed.setAttribute('aria-hidden', 'true');
                }
            }
            // initial
            updateOpenCollapsedVisibility();
        })();

        /* ---------- Dynamic Page Loader (loads content into #mainContent) ---------- */
        function loadPage(page) {
            const main = document.getElementById("mainContent");

            // Simple fade-out/fade-in for nicer UX
            main.style.opacity = 0.2;

            setTimeout(() => {
                if (page === "addUser") {
                    main.innerHTML = `
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-semibold text-gray-800">Add User</h2>
                        </div>
                        <div class="bg-white shadow rounded-lg p-6">
                            <form id="addUserForm" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Full Name</label>
                                    <input id="u_name" type="text" class="w-full mt-1 px-3 py-2 border rounded-lg" placeholder="Enter name" />
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Email</label>
                                    <input id="u_email" type="email" class="w-full mt-1 px-3 py-2 border rounded-lg" placeholder="Enter email" />
                                </div>

                                <div>
                                    <label class="block text-sm font-medium text-gray-700">Password</label>
                                    <input id="u_pass" type="password" class="w-full mt-1 px-3 py-2 border rounded-lg" placeholder="Enter password" />
                                </div>

                                <div class="flex items-center gap-2">
                                    <button type="button" onclick="submitAddUser()" class="px-4 py-2 bg-primary text-white rounded-lg">Submit</button>
                                    <button type="reset" class="px-4 py-2 border rounded-lg">Reset</button>
                                </div>
                            </form>
                        </div>
                    `;
                } else if (page === "userList") {
                    main.innerHTML = `
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl font-semibold text-gray-800">User List</h2>
                            <div>

        // Example handler for the "Add User" dummy form
        function submitAddUser() {
            const name = document.getElementById('u_name')?.value || '';
            const email = document.getElementById('u_email')?.value || '';
            const pass = document.getElementById('u_pass')?.value || '';

            // simple client-side validation
            if (!name.trim() || !email.trim() || !pass.trim()) {
                alert('Please fill all fields (this is demo-only).');
                return;
            }

            // Demo: add to the user list table if present
            const tbody = document.getElementById('userTableBody');
            if (tbody) {
                const id = tbody.children.length + 1;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 border">${id}</td>
                    <td class="p-3 border">${escapeHtml(name)}</td>
                    <td class="p-3 border">${escapeHtml(email)}</td>
                    <td class="p-3 border">Staff</td>
                    <td class="p-3 border">
                        <button class="px-2 py-1 text-sm border rounded">Edit</button>
                        <button class="px-2 py-1 text-sm border rounded">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            }

            // Reset and go to user list
            document.getElementById('addUserForm')?.reset();
            alert('User added (demo). Redirecting to User List...');
            loadPage('userList');
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Wire POS button to load POS demo
        document.getElementById('posBtn').addEventListener('click', function () {
            loadPage('pos');
        });
    </script>
