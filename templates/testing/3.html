<head>

    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],

            primary: {
              DEFAULT: '#1a4f9c',
              light: '#e8f0fe',
              dark: '#0d3a7a',

              blue: '#1a4f9c',

              yellow: '#f59e0b',

              green: '#22c55e',

              'orange-light': '#ffedd5',
              purple: '#8b5cf6',
              'purple-light': '#f3e8ff',
              red: '#ef4444',

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .nav-item.active {
      background: rgba(255, 255, 255, 0.15);
    }


    /* shrink specifics */
    .sidebar-shrink .nav-label {
      display: none;
    }

    .sidebar-shrink .submenu {
      display: none;
    }

    /* hide nested submenus in shrink mode */
    .sidebar-shrink .logo-text {
      display: none;
    }

    .sidebar-shrink .w-60 {
      width: 4.5rem !important;
    }

    /* Tailwind override to roughly w-18 */
    /* collapsed: hide sidebar completely */
    .sidebar-collapsed {
      transform: translateX(-120%);
    }

    /* arrow rotation */
    .arrow-rotated {
      transform: rotate(90deg);
    }

    /* mobile offcanvas overlay */
    .offcanvas-backdrop {
      background: rgba(0, 0, 0, 0.4);
    }

    .transition-fast {
      transition: all 220ms cubic-bezier(.2, .8, .2, 1);
    }
  </style>
</head>

  <script>
      (function () {
        const sidebar = document.getElementById('sidebar');
        const main = document.getElementById('main');
        const toggleShrink = document.getElementById('toggleShrink');
        const toggleCollapse = document.getElementById('toggleCollapse');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileSidebar = document.getElementById('mobileSidebar');
        const mobileBackdrop = document.getElementById('mobileSidebarBackdrop');
        const mobileClose = document.getElementById('mobileClose');

        // Mode state: 'expanded' | 'shrink' | 'collapsed'
        let mode = localStorage.getItem('sidebarMode') || 'expanded';

        function applyMode() {
          // cleanup classes
          document.body.classList.remove('sidebar-shrink', 'sidebar-collapsed');
          sidebar.classList.remove('sidebar-shrink', 'sidebar-collapsed');
          main.classList.remove('ml-20', 'ml-0', 'ml-60');

          if (mode === 'expanded') {
            // default wide sidebar
            sidebar.style.transform = '';
            sidebar.classList.remove('sidebar-shrink', 'sidebar-collapsed');
            main.style.marginLeft = '15rem'; // ml-60 equivalent
            main.classList.add('transition-fast');
            toggleShrink.setAttribute('aria-pressed', 'false');
            toggleCollapse.setAttribute('aria-pressed', 'false');
          } else if (mode === 'shrink') {
            // icons only
            sidebar.classList.add('sidebar-shrink');
            sidebar.style.transform = '';
            main.style.marginLeft = '4.5rem'; // small margin when shrink
            toggleShrink.setAttribute('aria-pressed', 'true');
            toggleCollapse.setAttribute('aria-pressed', 'false');
          } else if (mode === 'collapsed') {
            sidebar.classList.add('sidebar-collapsed');
            // put main margin to 0 so full width content visible
            main.style.marginLeft = '0';
            toggleShrink.setAttribute('aria-pressed', 'false');
            toggleCollapse.setAttribute('aria-pressed', 'true');
          }

          // save mode
          localStorage.setItem('sidebarMode', mode);
        }

        // initial apply
        applyMode();

        // Shrink toggle handler (toggle between expanded <-> shrink)
        toggleShrink.addEventListener('click', () => {
          if (mode === 'expanded') mode = 'shrink';
          else mode = 'expanded';
          applyMode();
        });

        // Collapse toggle handler (full collapse)
        toggleCollapse.addEventListener('click', () => {
          if (mode === 'collapsed') {
            // uncollapse -> go to expanded
            mode = 'expanded';
          } else {
            mode = 'collapsed';
          }
          applyMode();
        });

        // Submenu toggles (both desktop and mobile)
        document.querySelectorAll('[data-toggle="submenu"]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const targetId = btn.getAttribute('data-target');
            if (!targetId) return;
            const sub = document.getElementById(targetId);
            if (!sub) return;
            const arrow = btn.querySelector('.arrow');

            // If parent sidebar is in shrink mode, expand to show submenu briefly (UX choice) - here we simply ignore submenu toggles in shrink
            if (sidebar.classList.contains('sidebar-shrink') && btn.closest('#sidebar')) {
              // optionally show tooltip or nothing; we'll just flash open for accessibility:
              // do nothing (keeps it simple). Could expand sidebar programmatically if desired.
            } else {
              sub.classList.toggle('hidden');
              if (arrow) arrow.classList.toggle('arrow-rotated');
            }
          });
        });

        // Mobile off-canvas open
        mobileMenuBtn.addEventListener('click', () => {
          mobileSidebar.classList.remove('-translate-x-full');
          mobileBackdrop.classList.remove('hidden');
          mobileBackdrop.classList.add('block');
          setTimeout(() => {
            mobileSidebar.style.transform = 'translateX(0)';
          }, 10);
          mobileMenuBtn.setAttribute('aria-expanded', 'true');
        });

        // Mobile close
        function closeMobile() {
          mobileSidebar.style.transform = '';
          mobileSidebar.classList.add('-translate-x-full');
          mobileBackdrop.classList.add('hidden');
          mobileBackdrop.classList.remove('block');
          mobileMenuBtn.setAttribute('aria-expanded', 'false');
        }
        mobileClose.addEventListener('click', closeMobile);
        mobileBackdrop.addEventListener('click', closeMobile);

        // Close mobile on escape
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (!mobileBackdrop.classList.contains('hidden')) closeMobile();
          }
        });

        // When window resizes to small, ensure approach consistent (no major changes needed)
        window.addEventListener('resize', () => {
          // nothing special, but we could auto-switch mode on tiny screens if wanted
        });

        // Accessibility: if sidebar collapsed, show "openCollapsed" button in header
        const openCollapsed = document.getElementById('openCollapsed');
        function updateOpenCollapsedVisibility() {
          if (mode === 'collapsed') {
            openCollapsed.classList.remove('hidden');
            openCollapsed.setAttribute('aria-hidden', 'false');
            openCollapsed.addEventListener('click', () => {
              mode = 'expanded';
              applyMode();
            }, { once: true });
          } else {
            openCollapsed.classList.add('hidden');
            openCollapsed.setAttribute('aria-hidden', 'true');
          }
        }
        // initial
        updateOpenCollapsedVisibility();

        // update when mode changes
        const originalApply = applyMode;
        // wrap applyMode to also update openCollapsed visibility (we already call applyMode directly above so keep consistent)
        const applyModeWithUpdate = () => {
          originalApply();
          updateOpenCollapsedVisibility();
        };

        // replace function references used above to call wrapper
        window.applyMode = applyModeWithUpdate;
        // but keep local calls consistent
        applyMode = applyModeWithUpdate;
      })();
  </script>
