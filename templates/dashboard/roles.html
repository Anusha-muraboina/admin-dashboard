
{% extends 'dashboard/base.html' %}
{% block title %}Add User{% endblock %}
{% block content %}

  <style>
    .sort-icon:hover { opacity: 0.7; }
  </style>

  <div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Roles</h1>
        <p class="text-gray-500 text-sm mt-1">Manage roles</p>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      
    <!-- Toolbar -->
    <div class="p-5 border-b border-gray-200">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div class="flex items-center gap-3">
          <span class="text-sm text-gray-600">Show</span>
          <select class="border border-gray-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option>10</option>
            <option selected>25</option>
            <option>50</option>
            <option>100</option>
          </select>
          <span class="text-sm text-gray-600">entries</span>
        </div>

        <div class="flex gap-3 items-center">
          <input type="text" id="searchInput" placeholder="Search ..." 
                 class="px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-full lg:w-64" />

          <button onclick="openModal()" 
                  class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-full flex items-center gap-2 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd" />
            </svg>
            Add
          </button>
        </div>
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
      <table class="w-full">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th class="px-6 py-4 text-left text-xs font-medium text-gray-600 uppercase tracking-wider">
              <div class="flex items-center gap-2">
                Roles
                <svg id="sortIcon" class="w-4 h-4 cursor-pointer sort-icon text-gray-500 hover:text-gray-700 transition" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4" />
                </svg>
              </div>
            </th>
            <th class="px-6 py-4 text-center text-xs font-medium text-gray-600 uppercase tracking-wider">Action</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Admin</td>
            <td class="px-6 py-4 text-center">
              <div class="flex justify-center gap-2 flex-wrap">
                <button onclick="editRole('Admin')" class="text-blue-600 border border-blue-600 hover:bg-blue-50 px-4 py-1.5 rounded-md text-sm font-medium transition">
                  Edit
                </button>
                <button onclick="deleteRole('Admin')" class="text-red-600 border border-red-600 hover:bg-red-50 px-4 py-1.5 rounded-md text-sm font-medium transition">
                  Delete
                </button>
              </div>
            </td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Cashier</td>
            <td class="px-6 py-4 text-center">
              <div class="flex justify-center gap-2 flex-wrap">
                <button onclick="editRole('Cashier')" class="text-blue-600 border border-blue-600 hover:bg-blue-50 px-4 py-1.5 rounded-md text-sm font-medium transition">
                  Edit
                </button>
                <button onclick="deleteRole('Cashier')" class="text-red-600 border border-red-600 hover:bg-red-50 px-4 py-1.5 rounded-md text-sm font-medium transition">
                  Delete
                </button>
              </div>
            </td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">Only View</td>
            <td class="px-6 py-4 text-center">
              <div class="flex justify-center gap-2 flex-wrap">
                <button onclick="editRole('Only View')" class="text-blue-600 border border-blue-600 hover:bg-blue-50 px-4 py-1.5 rounded-md text-sm font-medium transition">
                  Edit
                </button>
                <button onclick="deleteRole('Only View')" class="text-red-600 border border-red-600 hover:bg-red-50 px-4 py-1.5 rounded-md text-sm font-medium transition">
                  Delete
                </button>
              </div>
            </td>
          </tr>
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">staff</td>
            <td class="px-6 py-4 text-center">
              <div class="flex justify-center gap-2 flex-wrap">
                <button onclick="editRole('staff')" class="text-blue-600 border border-blue-600 hover:bg-blue-50 px-4 py-1.5 rounded-md text-sm font-medium transition">
                  Edit
                </button>
                <button onclick="deleteRole('staff')" class="text-red-600 border border-red-600 hover:bg-red-50 px-4 py-1.5 rounded-md text-sm font-medium transition">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Footer Info & Pagination -->
    <div class="px-6 py-4 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-600 border-t border-gray-200">
      <div id="info" class="mb-3 sm:mb-0">Showing 1 to 4 of 4 entries</div>
      <div class="flex gap-2">
        <button class="px-4 py-2 border border-gray-300 rounded-md bg-white hover:bg-gray-50 disabled:opacity-50" disabled>Previous</button>
        <button class="px-4 py-2 bg-blue-600 text-white rounded-md">1</button>
        <button class="px-4 py-2 border border-gray-300 rounded-md bg-white hover:bg-gray-50 disabled:opacity-50" disabled>Next</button>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div id="roleModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-md mx-4">
      <div class="flex justify-between items-center p-6 border-b">
        <h3 id="modalTitle" class="text-lg font-semibold">Add New Role</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Role Name</label>
        <input type="text" id="roleNameInput" class="w-full px-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter role name" />
      </div>
      <div class="flex justify-end gap-3 p-6 border-t">
        <button onclick="closeModal()" class="px-5 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</button>
        <button onclick="saveRole()" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Save</button>
      </div>
    </div>
  </div>

  <!-- Fixed Footer -->
  <div class="fixed bottom-0 left-0 right-0 bg-gray-100 border-t border-gray-300 text-center py-3 text-sm text-gray-600">
    LEKAJHOKA - V6.10 | Copyright © 2025 All rights reserved.
  </div>

  <script>
    let editingRole = null;

    function openModal() {
      document.getElementById('modalTitle').textContent = 'Add New Role';
      document.getElementById('roleNameInput').value = '';
      editingRole = null;
      document.getElementById('roleModal').classList.remove('hidden');
      document.getElementById('roleModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('roleModal').classList.add('hidden');
      document.getElementById('roleModal').classList.remove('flex');
    }

    function editRole(name) {
      document.getElementById('modalTitle').textContent = 'Edit Role';
      document.getElementById('roleNameInput').value = name;
      editingRole = name;
      openModal();
    }

    function deleteRole(name) {
      if (confirm(`Are you sure you want to delete the role "${name}"?`)) {
        alert(`Role "${name}" has been deleted!`);
        // Add backend delete logic here
        location.reload();
      }
    }

    function saveRole() {
      const name = document.getElementById('roleNameInput').value.trim();
      if (!name) {
        alert('Please enter a role name');
        return;
      }
      if (editingRole) {
        alert(`Role updated: "${editingRole}" → "${name}"`);
      } else {
        alert(`New role added: "${name}"`);
      }
      closeModal();
      location.reload(); // Remove when connected to backend
    }

    // Search
    document.getElementById('searchInput').addEventListener('input', function() {
      const term = this.value.toLowerCase();
      document.querySelectorAll('#tableBody tr').forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(term) ? '' : 'none';
      });
    });

    // Sort
    let ascending = true;
    document.getElementById('sortIcon').addEventListener('click', () => {
      const tbody = document.getElementById('tableBody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      rows.sort((a, b) => {
        const aText = a.cells[0].textContent.trim();
        const bText = b.cells[0].textContent.trim();
        return ascending ? aText.localeCompare(bText) : bText.localeCompare(aText);
      });
      rows.forEach(row => tbody.appendChild(row));
      ascending = !ascending;
    });
  </script>


{% endblock %}
