

 {% extends 'dashboard/base.html' %}
{% block title %}Edit User{% endblock %}

{% block content %}
 


<style>
    .required:after { content: " *"; color: red; }
  
</style>

  <div class="flex">


    <!-- Main Content -->
    <main class="flex-1 p-2">
      <div class="bg-white rounded-lg shadow-lg  mx-auto">
        <!-- Header -->
        <header class=" text-black p-2 rounded-t-lg">
          <h1 class="text-3xl font-bold">Edit User</h1>
        </header>

        <form class="p-6 space-y-10">
          <!-- Basic Information -->
          <section>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div>
                <label class="block text-sm font-medium text-gray-700">Prefix:</label>
                <select class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2">
                  <option>Mr.</option>
                  <option>Mrs.</option>
                  <option selected>Miss</option>
                </select>
              </div>
              <div>
                <label class="block text-sm font-medium required">First Name:</label>
                <input type="text" value="anusha" class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2" required>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Last Name:</label>
                <input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2" placeholder="Last Name">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6 items-end">
              <div>
                <label class="block text-sm font-medium required">Email:</label>
                <input type="email" value="anushamuraboina9@gmail.com" class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2" required>
              </div>
              <div class="flex flex-wrap items-center gap-6">
                <label class="flex items-center">
                  <input type="checkbox" class="mr-2 h-5 w-5 text-blue-600" checked>
                  <span>Is active?</span>
                  <i class="fas fa-info-circle text-blue-500 ml-2"></i>
                </label>
                <label class="flex items-center">
                  <input type="checkbox" id="enable-staff-pin" class="mr-2 h-5 w-5 text-blue-600">
                  <span>Enable service staff pin</span>
                  <i class="fas fa-info-circle text-blue-500 ml-2"></i>
                </label>
              </div>
            </div>
          </section>

          <!-- Roles and Permissions -->
          <section class="border-t pt-8">
            <h3 class="text-xl font-semibold mb-6">Roles and Permissions</h3>
            <label class="flex items-center mb-6">
              <input type="checkbox" id="allow-login" class="mr-3 h-5 w-5 text-blue-600" checked>
              <span class="font-medium">Allow login</span>
            </label>

            <!-- Login Fields (Conditional - Password optional) -->
            <div id="login-fields" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div>
                <label class="block text-sm font-medium text-gray-700">Password:</label>
                <input type="password" class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2" placeholder="Password">
                <p class="text-xs text-gray-500 mt-1">Leave password field blank if you don't want to update</p>
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Confirm Password:</label>
                <input type="password" class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2" placeholder="Confirm Password">
              </div>
              <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700">Role <i class="fas fa-info-circle text-blue-500 ml-1"></i></label>
                <select class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2">
                  <option selected>Admin</option>
                  <option>Cashier</option>
                  <option>Only View</option>
                </select>
              </div>
            </div>

            <!-- Access Locations -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-3">Access locations <i class="fas fa-info-circle text-blue-500 ml-1"></i></label>
              <label class="flex items-center mb-2">
                <input type="checkbox" class="mr-3 h-5 w-5 text-blue-600" checked>
                <span>All Locations</span>
                <i class="fas fa-info-circle text-blue-500 ml-2"></i>
              </label>
              <div class="ml-8">
                <label class="flex items-center text-gray-500">
                  <input type="checkbox" class="mr-3" disabled>
                  <span>Farmhouse Hyderabad (BL0001)</span>
                </label>
              </div>
            </div>
          </section>

          <!-- Sales -->
          <section class="border-t pt-8">
            <h3 class="text-xl font-semibold mb-6">Sales</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-gray-700">Sales Commission Percentage (%) <i class="fas fa-info-circle text-blue-500 ml-1"></i></label>
                <input type="number" value="0.00" class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2">
              </div>
              <div>
                <label class="block text-sm font-medium text-gray-700">Max sales discount percent <i class="fas fa-info-circle text-blue-500 ml-1"></i></label>
                <input type="number" class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2" placeholder="Max sales discount percent">
              </div>
            </div>
            <div class="mt-6">
              <label class="flex items-center">
                <input type="checkbox" class="mr-3 h-5 w-5 text-blue-600">
                <span>Allow Selected Contacts <i class="fas fa-info-circle text-blue-500 ml-2"></i></span>
              </label>
            </div>
          </section>

          <!-- More Information (Same as Add User) -->
          <section class="border-t pt-8">
            <h3 class="text-xl font-semibold mb-6">More Information</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 text-sm">
              <!-- All fields same as Add User, left empty for brevity -->
              <div><label class="block text-gray-700">Date of birth:</label><input type="date" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Gender:</label><select class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"><option>Please Select</option></select></div>
              <div><label class="block text-gray-700">Marital Status:</label><select class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"><option>Please Select</option></select></div>
              <div><label class="block text-gray-700">Blood Group:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Mobile Number:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Alternate contact number:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Family contact number:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Facebook Link:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Twitter Link:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Social Media 1:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Social Media 2:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Custom field 1:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Custom field 2:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Custom field 3:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Custom field 4:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Guardian Name:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">ID proof name:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">ID proof number:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div class="md:col-span-2"><label class="block text-gray-700">Permanent Address:</label><textarea class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" rows="3"></textarea></div>
              <div class="md:col-span-2"><label class="block text-gray-700">Current Address:</label><textarea class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2" rows="3"></textarea></div>
            </div>
          </section>

          <!-- Bank Details, HRM, Payroll (Same as Add) -->
          <section class="border-t pt-8">
            <h3 class="text-xl font-semibold mb-6">Bank Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 text-sm">
              <div><label class="block text-gray-700">Account Holder's Name:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Account Number:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Bank Name:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Bank Identifier Code <i class="fas fa-info-circle text-blue-500"></i></label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Branch:</label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
              <div><label class="block text-gray-700">Tax Payer ID <i class="fas fa-info-circle text-blue-500"></i></label><input type="text" class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2"></div>
            </div>
          </section>

          <section class="border-t pt-8">
            <h3 class="text-xl font-semibold mb-6">HRM Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div><label class="block text-gray-700">Department:</label><select class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2"><option>Please Select</option></select></div>
              <div><label class="block text-gray-700">Designation:</label><select class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2"><option>Please Select</option></select></div>
            </div>
          </section>

          <section class="border-t pt-8 pb-10">
            <h3 class="text-xl font-semibold mb-6">Payroll</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div><label class="block text-gray-700">primary work location:</label><select class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2"><option>Please Select</option></select></div>
              <div><label class="block text-gray-700">Basic salary:</label><input type="number" class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2" placeholder="Basic salary"></div>
              <div><label class="block text-gray-700">Pay Components:</label><select class="mt-1 block w-full border border-gray-300 rounded-md px-4 py-2"><option>Per Month</option></select></div>
            </div>
          </section>

          <!-- Update Button -->
          <div class="border-t pt-8 flex justify-end">
            <button type="submit" class="px-10 py-3 bg-purple-600 text-white rounded-md hover:bg-purple-700 font-medium text-lg">Update</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    // Optional: Toggle login fields visibility
    document.getElementById('allow-login').addEventListener('change', function() {
      document.getElementById('login-fields').classList.toggle('hidden', !this.checked);
    });
  </script>
{% endblock %}
