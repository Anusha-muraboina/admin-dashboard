                    <!-- Calculator Button -->
<div class="relative">
    <button onclick="toggleCalculator()" 
            class="p-2 text-white/80 hover:text-white hover:bg-white/10 rounded-lg">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 10h18M7 6h10v12H7zM11 16v.01M15 16v.01"></path>
        </svg>
    </button>

    <!-- Calculator Dropdown -->
    <div id="calculatorDropdown"
         class="hidden absolute right-0 mt-2 w-48 bg-white text-gray-800 rounded-lg shadow-lg border p-4 z-50">

        <input id="calcDisplay" 
               type="text"
               class="w-full border rounded p-2 text-right mb-2"
               placeholder="0" readonly>

        <div class="grid grid-cols-4 gap-2">
            <button onclick="pressCalc('7')" class="btn-calc">7</button>
            <button onclick="pressCalc('8')" class="btn-calc">8</button>
            <button onclick="pressCalc('9')" class="btn-calc">9</button>
            <button onclick="pressCalc('/')" class="btn-op">÷</button>

            <button onclick="pressCalc('4')" class="btn-calc">4</button>
            <button onclick="pressCalc('5')" class="btn-calc">5</button>
            <button onclick="pressCalc('6')" class="btn-calc">6</button>
            <button onclick="pressCalc('*')" class="btn-op">×</button>

            <button onclick="pressCalc('1')" class="btn-calc">1</button>
            <button onclick="pressCalc('2')" class="btn-calc">2</button>
            <button onclick="pressCalc('3')" class="btn-calc">3</button>
            <button onclick="pressCalc('-')" class="btn-op">−</button>

            <button onclick="pressCalc('0')" class="btn-calc col-span-2">0</button>
            <button onclick="pressCalc('.')" class="btn-calc">.</button>
            <button onclick="calculateResult()" class="btn-op">=</button>

            <button onclick="clearCalc()" class="col-span-4 bg-red-500 text-white rounded p-2 mt-2">Clear</button>
        </div>
    </div>
</div>

            <script>
function toggleCalculator() {
    document.getElementById("calculatorDropdown").classList.toggle("hidden");
}

let calcInput = "";

function pressCalc(val) {
    calcInput += val;
    document.getElementById("calcDisplay").value = calcInput;
}

function clearCalc() {
    calcInput = "";
    document.getElementById("calcDisplay").value = "";
}

function calculateResult() {
    try {
        calcInput = eval(calcInput).toString();
        document.getElementById("calcDisplay").value = calcInput;
    } catch {
        document.getElementById("calcDisplay").value = "Error";
        calcInput = "";
    }
}

// Close calculator if clicking outside
document.addEventListener("click", function (e) {
    const calc = document.getElementById("calculatorDropdown");
    if (!calc.contains(e.target) && !e.target.closest("button[onclick='toggleCalculator()']")) {
        calc.classList.add("hidden");
    }
});
</script>
<script>
function toggleActionMenu() {
    document.getElementById("actionMenu").classList.toggle("hidden");
}

// Close dropdown when clicking outside
document.addEventListener("click", function (e) {
    const menu = document.getElementById("actionMenu");
    const button = e.target.closest("button[onclick='toggleActionMenu()']");

    if (!menu.contains(e.target) && !button) {
        menu.classList.add("hidden");
    }
});
</script>
